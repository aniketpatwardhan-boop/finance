const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFromPw(pw){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt']);}
async function unlock(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.data));
 const ds=new DecompressionStream('gzip');const st=new Blob([pt]).stream().pipeThrough(ds);
 const html=await new Response(st).text();document.open();document.write(html);document.close();}
async function go(){const pw=document.getElementById('pw').value;document.getElementById('err').textContent='';
 try{const key=await keyFromPw(pw);
  if(document.getElementById('rem').checked){const jwk=await crypto.subtle.exportKey('jwk',key);try{localStorage.setItem('fcc_k',JSON.stringify(jwk));}catch(e){}}
  await unlock(key);}catch(e){document.getElementById('err').textContent='Wrong password.';}}
document.getElementById('go').onclick=go;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
(async()=>{try{const s=localStorage.getItem('fcc_k');if(!s)return;
 const key=await crypto.subtle.importKey('jwk',JSON.parse(s),{name:'AES-GCM'},false,['decrypt']);
 await unlock(key);}catch(e){try{localStorage.removeItem('fcc_k');}catch(_){}}})();
